# Netlify : démo navigateur Lisio (demo/) et redirection vers l'application ; aucune commande de build.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le site vitrine est remplacé par la landing page de l'application (v2) : toute adresse du site y redirige,
# sauf ses polices. Plus de démo publique : un essai de 14 jours est ouvert sur demande dans l'application.
# Redirection temporaire (302) : réversible sans cache permanent chez les visiteurs, et à mettre à jour
# le jour où l'application a son propre domaine. Les règles s'appliquent dans l'ordre : la première trouvée l'emporte.
[[redirects]]
  from = "/fonts/*"
  to = "/fonts/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://dashboards-ia-creetacrea.vercel.app/"
  status = 302
  force = true
